# Loki stack values (Loki + Promtail)
# Install: helm upgrade --install loki grafana/loki-stack \
#   -n monitoring --create-namespace -f loki-values.yaml

loki:
  enabled: true
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    auth_enabled: false
    ingester:
      chunk_idle_period: 3m
      chunk_block_size: 262144
      chunk_retain_period: 1m
    schema_config:
      configs:
        - from: 2024-01-01
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h

promtail:
  enabled: true
  # Promtail runs as a DaemonSet on every node to collect container logs
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  config:
    snippets:
      pipelineStages:
        - docker: {}
        - labeldrop:
            - filename
