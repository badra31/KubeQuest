# Gabarit pour helm/sample-app/values-secret.yaml (fichier NON versionné, voir .gitignore).
#
# Copier ce fichier en "values-secret.yaml" dans ce même dossier, remplacer les
# valeurs ci-dessous, puis déployer avec :
#   helm upgrade --install sample-app . -f values.yaml -f values-secret.yaml
#
# Pour générer une nouvelle APP_KEY Laravel valide :
#   php artisan key:generate --show

app:
  key: "REMPLACER_PAR_UNE_VRAIE_APP_KEY_BASE64"

postgresql:
  auth:
    password: "REMPLACER_PAR_UN_VRAI_MOT_DE_PASSE"
