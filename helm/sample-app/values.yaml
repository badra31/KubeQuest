# Nombre de replicas (pods) de l'application
replicaCount: 2

# Image Docker de l'application
image:
  repository: ghcr.io/badra31/kube-quest-app
  tag: "latest"
  pullPolicy: Always

# Configuration de l'application Laravel
app:
  name: kube-quest
  env: production
  debug: "false"
  # app.key et postgresql.auth.password NE SONT PAS ICI : ce fichier est versionné dans Git.
  # Ces valeurs doivent venir de helm/sample-app/values-secret.yaml (non versionné, voir
  # values-secret.example.yaml pour le gabarit), fourni au déploiement avec :
  #   helm upgrade --install sample-app . -f values.yaml -f values-secret.yaml
  key: ""
  url: "http://kube-quest.local"

# Configuration PostgreSQL
postgresql:
  auth:
    username: app_user
    password: ""
    database: app_database
  primary:
    persistence:
      enabled: true
      size: 2Gi
    containerSecurityContext:
      readOnlyRootFilesystem: false
    podSecurityContext:
      fsGroup: 1001

# Limites de ressources — bonne pratique Kubernetes obligatoire
resources:
  requests:
    cpu: 100m      # 0.1 CPU minimum garanti
    memory: 128Mi  # 128 MB RAM minimum garanti
  limits:
    cpu: 500m      # 0.5 CPU maximum autorisé
    memory: 256Mi  # 256 MB RAM maximum autorisé

# Service — comment exposer l'appli dans le cluster
service:
  type: ClusterIP
  port: 80

# Ingress — comment exposer l'appli vers l'extérieur
ingress:
  enabled: true
  className: nginx
  host: kube-quest.local

# Probes — vérifications de santé des pods
# enabled: false = désactivé (utile pour déboguer)
# enabled: true  = activé (recommandé en production)
# Auto-scaling horizontal — Kubernetes ajuste le nombre de pods selon la charge CPU
hpa:
  minReplicas: 2      # minimum garanti même sans charge
  maxReplicas: 3      # maximum autorisé pendant un pic (limité par la RAM des t3.small)
  targetCPUUtilizationPercentage: 50  # scale up si CPU > 50% de la request

livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5      # délai max pour que l'app réponde à la probe
  failureThreshold: 3    # nombre d'échecs consécutifs avant de tuer le pod

readinessProbe:
  enabled: true
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 3
