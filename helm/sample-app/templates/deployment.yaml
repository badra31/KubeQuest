apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-quest
spec:
  replicas: {{ .Values.replicaCount }}
  # Pendant un rolling update : crée 1 nouveau pod avant d'en supprimer 1 ancien
  # maxSurge=1 : max 1 pod supplémentaire temporaire
  # maxUnavailable=0 : aucun pod hors service pendant la mise à jour
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/part-of: kube-quest
    spec:
      # ServiceAccount dedie (voir serviceaccount.yaml) au lieu du "default"
      # implicite du namespace : evite qu'un futur Role/RoleBinding attribue
      # par erreur au "default" du namespace ne s'applique aussi a ce pod.
      serviceAccountName: {{ .Release.Name }}
      # fsGroup : les volumes emptyDir ci-dessous (storage, bootstrap-cache,
      # etc.) sont montes avec le groupe 33 (www-data), pour que les
      # conteneurs non-root (voir securityContext plus bas) puissent y ecrire.
      securityContext:
        fsGroup: 33
      # Répartit les pods sur des noeuds différents pour la haute disponibilité
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - {{ .Release.Name }}
                topologyKey: kubernetes.io/hostname

      # initContainers = conteneurs qui s'exécutent AVANT le conteneur principal
      # Kubernetes attend que chaque initContainer réussisse avant de passer au suivant
      initContainers:
        # Étape 1 : attendre que PostgreSQL accepte les connexions
        - name: wait-for-db
          image: busybox
          command: ['sh', '-c', 'until nc -z {{ .Release.Name }}-postgresql 5432; do echo "En attente de PostgreSQL..."; sleep 3; done; echo "PostgreSQL est pret."']
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

        # Étape 2 : copier la structure storage/ et bootstrap/cache/ de l'image
        # (avec les droits www-data deja corrects, voir Dockerfile) vers des
        # volumes emptyDir ecrivables. Necessaire car readOnlyRootFilesystem
        # (voir conteneur "app" plus bas) empeche Laravel d'ecrire dans le
        # filesystem de l'image lui-meme ; sans cette copie, monter un volume
        # vide directement sur storage/ ecraserait sa structure attendue
        # (storage/logs, storage/framework/cache, etc.) et ferait planter l'app.
        - name: init-storage
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ['sh', '-c', 'cp -a /var/www/html/storage/. /mnt/storage/ && cp -a /var/www/html/bootstrap/cache/. /mnt/bootstrap-cache/']
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: storage
              mountPath: /mnt/storage
            - name: bootstrap-cache
              mountPath: /mnt/bootstrap-cache

        # Étape 3 : lancer les migrations Laravel (crée les 5 tables si elles n'existent pas)
        # --force est obligatoire en mode production (Laravel demande confirmation sinon)
        - name: migrate
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ['php', 'artisan', 'migrate', '--force']
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
            - name: bootstrap-cache
              mountPath: /var/www/html/bootstrap/cache
            - name: tmp
              mountPath: /tmp

      containers:
        - name: app
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80

          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secret

          # Durci et verifie manuellement (docker run --read-only --cap-drop=ALL
          # --cap-add=NET_BIND_SERVICE --user 33:33) avant d'etre ecrit ici :
          # NET_BIND_SERVICE est la seule capability necessaire, pour se lier
          # au port 80 (<1024) sans etre root.
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]

          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
            - name: bootstrap-cache
              mountPath: /var/www/html/bootstrap/cache
            - name: tmp
              mountPath: /tmp
            - name: apache-run
              mountPath: /var/run/apache2
            - name: apache-lock
              mountPath: /var/lock/apache2
            - name: apache-log
              mountPath: /var/log/apache2

          # Les probes sont contrôlées par values.yaml (enabled: true/false)
          # livenessProbe : Kubernetes redémarre le pod si l'app ne répond plus
          # readinessProbe : le pod ne reçoit pas de trafic tant qu'il n'est pas prêt
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}

          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}

      volumes:
        - name: storage
          emptyDir: {}
        - name: bootstrap-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: apache-run
          emptyDir: {}
        - name: apache-lock
          emptyDir: {}
        - name: apache-log
          emptyDir: {}
