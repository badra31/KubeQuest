# Pendant obligatoire de networkpolicy-app-egress.yaml et
# networkpolicy-backup-egress.yaml : une regle Egress cote client ne suffit
# PAS a elle seule, il faut aussi que PostgreSQL accepte l'entree. Cette
# policy autorise UNIQUEMENT deux sources a entrer sur le port 5432 -- les
# pods de l'app (label "app: {{ .Release.Name }}") et les pods du CronJob de
# backup (label "app.kubernetes.io/component: backup") -- aucune autre
# source, aucun autre port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-postgresql-ingress
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-quest
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: primary
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backup
      ports:
        - protocol: TCP
          port: 5432
