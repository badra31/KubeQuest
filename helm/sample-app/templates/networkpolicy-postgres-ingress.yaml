# Pendant obligatoire de networkpolicy-app-egress.yaml : une regle Egress
# cote app ne suffit PAS a elle seule, il faut aussi que PostgreSQL accepte
# l'entree. Cette policy autorise UNIQUEMENT les pods de l'app a entrer sur
# le port 5432 -- aucune autre source, aucun autre port. Meme un autre pod
# du meme namespace ne peut pas s'y connecter s'il n'a pas le label
# "app: {{ .Release.Name }}".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-postgresql-ingress
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-quest
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: primary
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 5432
