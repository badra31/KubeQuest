apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-quest
# automountServiceAccountToken: false — l'application (Laravel + PostgreSQL)
# n'appelle jamais l'API Kubernetes (pas de client K8s, pas de kubectl dans
# le code). Par defaut, Kubernetes monte quand meme un token d'API dans
# chaque pod ; le desactiver ici retire ce vecteur d'attaque potentiel si le
# conteneur applicatif est un jour compromis (ex. RCE), sans avoir a
# attribuer de Role/RoleBinding inutile — c'est le "strict minimum" reel
# pour ce workload : zero permission, car aucune n'est necessaire.
automountServiceAccountToken: false
