# Meme logique que networkpolicy-app-egress.yaml, mais pour les pods du
# CronJob de backup (etiquette app.kubernetes.io/component: backup, PAS
# "app: {{ .Release.Name }}" -- voir backup-cronjob.yaml pour pourquoi).
# Sans cette policy, le deny-all par defaut bloquerait pg_dump avant meme
# qu'il puisse joindre PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backup-egress
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-quest
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backup
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: primary
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
