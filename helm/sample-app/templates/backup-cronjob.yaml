# CronJob = version Kubernetes d'une tache cron : lance un Job (pod a usage
# unique, s'arrete une fois termine) selon l'horaire defini ci-dessous.
#
# Commande validee manuellement avec Docker avant d'etre ecrite ici
# (postgres:18, --user 999:999, --cap-drop=ALL, --read-only) : creation
# d'une donnee -> pg_dump -> suppression totale -> pg_restore -> donnee
# bien recuperee. Voir README section Sauvegarde pour la procedure de
# restauration complete a executer sur le cluster reel.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-quest
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  # Empeche deux dumps de tourner en meme temps si le precedent n'est pas
  # termine (ex. base tres volumineuse un jour donne).
  concurrencyPolicy: Forbid
  # Nombre de Jobs Kubernetes conserves dans l'historique (kubectl get jobs)
  # -- n'affecte PAS le nombre de fichiers de dump conserves sur le volume,
  # gere separement par retentionDays ci-dessous.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            # Etiquette DIFFERENTE de "app: {{ .Release.Name }}" (utilisee par
            # le Service et les autres NetworkPolicy) : ce pod ne fait pas
            # tourner Apache, il ne doit jamais recevoir de trafic web.
            app.kubernetes.io/name: {{ .Release.Name }}
            app.kubernetes.io/component: backup
            app.kubernetes.io/part-of: kube-quest
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 999
          containers:
            - name: pg-dump
              image: {{ .Values.backup.image }}
              # bash (pas sh) : necessaire pour "set -o pipefail", non supporte
              # par le sh minimal (dash) de cette image Debian.
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  TS=$(date +%Y%m%d-%H%M%S)
                  TMPFILE="/backup/.backup-${TS}.dump.tmp"
                  FINALFILE="/backup/backup-${TS}.dump"
                  echo "Debut du dump PostgreSQL vers $TMPFILE"

                  if ! PGPASSWORD="$DB_PASSWORD" pg_dump -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -F c -f "$TMPFILE"; then
                    echo "ERREUR : pg_dump a echoue (code de sortie non nul)" >&2
                    rm -f "$TMPFILE"
                    exit 1
                  fi

                  if [ ! -s "$TMPFILE" ]; then
                    echo "ERREUR : le dump est vide (0 octet), suppression : $TMPFILE" >&2
                    rm -f "$TMPFILE"
                    exit 1
                  fi

                  # Un fichier non vide n'est pas forcement une archive valide
                  # (ecriture interrompue, pod tue en cours de dump...).
                  # pg_restore --list lit la table des matieres de l'archive
                  # sans rien restaurer ; si l'archive est corrompue, ca echoue.
                  if ! pg_restore --list "$TMPFILE" > /dev/null 2>&1; then
                    echo "ERREUR : archive invalide, echec de pg_restore --list, suppression : $TMPFILE" >&2
                    rm -f "$TMPFILE"
                    exit 1
                  fi

                  # Renomme seulement APRES validation complete : un fichier
                  # invalide n'apparait jamais sous le nom final backup-*.dump.
                  mv "$TMPFILE" "$FINALFILE"
                  echo "Dump reussi et valide : $FINALFILE ($(du -h "$FINALFILE" | cut -f1))"
                  find /backup -name "backup-*.dump" -mtime +{{ .Values.backup.retentionDays }} -delete
                  echo "Nettoyage des dumps de plus de {{ .Values.backup.retentionDays }} jours termine"
              envFrom:
                - configMapRef:
                    name: {{ .Release.Name }}-config
                - secretRef:
                    name: {{ .Release.Name }}-secret
              securityContext:
                runAsNonRoot: true
                runAsUser: 999
                runAsGroup: 999
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: {{ .Release.Name }}-backup
            - name: tmp
              emptyDir: {}
